<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obra 002: Fermentadora - Marina Benitez Schaefer</title>
    <style>
        /* Mantenemos la paleta orgánica del menú principal */
        body { 
            font-family: 'Georgia', serif; 
            text-align: center; 
            padding: 40px 20px; 
            background-color: #fcf9f5; 
            color: #2c2c2c; 
            margin: 0;
            letter-spacing: 0.02em;
        }
        
        .contenedor { 
            max-width: 460px; 
            margin: auto; 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 4px; 
            box-shadow: 0 8px 24px rgba(139, 94, 60, 0.04); 
            border-top: 5px solid #8b5e3c; 
        }
        
        .volver {
            display: inline-block;
            text-align: left;
            width: 100%;
            margin-bottom: 20px;
            font-family: sans-serif;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a67c52;
            text-decoration: none;
            font-weight: bold;
        }
        .volver:hover {
            color: #8b5e3c;
        }
        
        h1 { 
            color: #8b5e3c; 
            font-size: 1.6em;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .codigo-pieza {
            font-size: 0.85em;
            color: #a67c52;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* Ficha Técnica Estilo Catálogo */
        .ficha-tecnica {
            text-align: left;
            background: #fdfaf6;
            border: 1px solid #e2d1c3;
            border-radius: 4px;
            padding: 25px;
            margin: 30px 0;
        }

        .campo {
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .campo:last-child {
            margin-bottom: 0;
        }

        .etiqueta {
            font-family: sans-serif;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #a67c52;
            display: block;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .valor {
            font-size: 1.05em;
            color: #2c2c2c;
        }

        /* Enlace al proceso / Estado */
        .proceso-contenedor {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0e6df;
        }

        .estado-proceso {
            font-style: italic;
            color: #7a7a7a;
            font-size: 0.95em;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <!-- Enlace para regresar al menú principal -->
        <a href="index.html" class="volver">← Volver al catálogo</a>
        
        <h1>Fermentadora</h1>
        <div class="codigo-pieza">Obra #002</div>
        
        <!-- FICHA TÉCNICA -->
        <div class="ficha-tecnica">
            <div class="campo">
                <span class="etiqueta">Materiales</span>
                <span class="valor">Arcilla blanca y esmalte transparente.</span>
            </div>
            
            <div class="campo">
                <span class="etiqueta">Técnica</span>
                <span class="valor">Torno.</span>
            </div>
            
            <div class="campo">
                <span class="etiqueta">Medidas aproximadas</span>
                <span class="valor">20 cm alto, 15 cm diámetro.</span>
            </div>
        </div>
        
        <!-- LINK A PROCESO DE ARMADO -->
        <div class="proceso-contenedor">
            <span class="etiqueta">Proceso de armado</span>
            <p class="estado-proceso">Próximamente actualizaré el registro de creación de esta pieza.</p>
        </div>
        
    </div>
</body>
</html>
